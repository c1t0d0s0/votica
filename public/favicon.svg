<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="votica-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="35%" stop-color="#4f46e5" />
      <stop offset="70%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background with smooth rounded corners -->
  <rect width="512" height="512" rx="116" fill="url(#votica-grad)" />

  <!-- Ambient light glow at top right -->
  <circle cx="450" cy="60" r="260" fill="#ffffff" opacity="0.1" />

  <!-- Ballot Paper (Card) -->
  <g filter="url(#shadow)">
    <rect x="151" y="80" width="210" height="230" rx="22" fill="#ffffff" />

    <!-- Bold Dynamic Checkmark (Votica V-check) -->
    <path d="M198 195 L242 239 L314 153" fill="none" stroke="#4f46e5" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Subtle lines on ballot -->
    <rect x="196" y="258" width="120" height="8" rx="4" fill="#e0e7ff" />
    <rect x="216" y="272" width="80" height="7" rx="3.5" fill="#eef2ff" />
  </g>

  <!-- Ballot Box Structure -->
  <g filter="url(#shadow)">
    <!-- Box Body (Lower Container) -->
    <rect x="106" y="280" width="300" height="106" rx="18" fill="#ffffff" />

    <!-- Box Lid / Slot Bar -->
    <rect x="88" y="260" width="336" height="46" rx="15" fill="#ffffff" />

    <!-- Insertion Slot Slit -->
    <rect x="128" y="277" width="256" height="12" rx="6" fill="#3730a3" />

    <!-- Front Emblem -->
    <rect x="236" y="322" width="40" height="12" rx="6" fill="#eef2ff" />
    <circle cx="256" cy="328" r="3" fill="#6366f1" />
  </g>
</svg>
